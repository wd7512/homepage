[project]
name = "homepage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8.0",
    "ruff>=0.11",
]
# Only needed to regenerate src/adapters/outbound/icon_codec.json:
#   uv run --group train python scripts/train_icons.py
train = [
    "numpy>=2.0",
    "torch>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/ports"]
