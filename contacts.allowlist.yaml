# Public contacts allowlist — homepage
#
# Single source of truth for which contact details may appear in the
# working tree and in git history at public-release time. Anything that
# looks like an email, phone number, LinkedIn URL, or GitHub URL and is
# not listed here (or matched by allow_patterns) makes
# scripts/check_contacts.py exit non-zero.
#
# Phone numbers are intentionally not allowed: the domain has no phone
# field, and no phone number should be public.

emails:
  - wwdennis.research@gmail.com

phones: []

urls:
  - https://github.com/wd7512
  - https://uk.linkedin.com/in/williamwudennis
  - https://wd7512.github.io/homepage/
  - https://orcid.org/0009-0005-4769-3136
  - https://scholar.google.com/citations?hl=en&user=MKqzBNYAAAAJ

allow_patterns:
  - .*@users\.noreply\.github\.com
  - https://github\.com/wd7512/.*
  - https://wd7512\.github\.io/.*
